name: Build site from content

# The admin panel (/admin/) saves edits as commits to content/*.json or
# assets/uploads/. This workflow regenerates the HTML pages and commits them,
# and Hostinger's auto-deploy then publishes the new commit.
on:
  push:
    branches: [master]
    paths:
      - "content/**"
      - "build/**"
      - "css/**"
      - "js/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate pages
        run: python build/build.py --no-images

      - name: Commit generated pages
        run: |
          git config user.name "nexbridge-site-builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Pages already up to date."
            exit 0
          fi
          git commit -m "Rebuild pages from content"
          for attempt in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 5
          done
          exit 1
